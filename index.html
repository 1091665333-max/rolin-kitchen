<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>功能医学视角亚健康自测表 | Rolin厨房</title>
<style>
:root {
  --bg: #faf9f6;
  --card: #ffffff;
  --text: #2c2c2c;
  --text-secondary: #888888;
  --accent: #b8754a;
  --accent-light: #f5ede6;
  --border: #e8e4df;
  --shadow: 0 1px 3px rgba(0,0,0,0.04);
  --green: #6a9b7d;
  --yellow: #c4973b;
  --orange: #c46e3b;
  --red: #b84a4a;
  --progress-bg: #ebe7e2;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250,249,246,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.header-brand {
  font-size: 13px; color: var(--accent); font-weight: 600;
  letter-spacing: 0.5px;
}
.header-title {
  font-size: 15px; font-weight: 600; color: var(--text);
}
.progress-bar-wrap {
  height: 3px; background: var(--progress-bg); border-radius: 2px;
}
.progress-bar-fill {
  height: 100%; background: var(--accent); border-radius: 2px;
  transition: width 0.3s ease;
}
.progress-text {
  font-size: 11px; color: var(--text-secondary); text-align: right; margin-top: 4px;
}

/* Main */
.main { padding: 16px; max-width: 640px; margin: 0 auto; }

/* Welcome */
.welcome {
  text-align: center; padding: 32px 16px;
}
.welcome-icon { font-size: 48px; margin-bottom: 16px; }
.welcome h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.welcome .subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.7; }
.welcome .meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; }
.welcome .meta span { display: inline-block; background: var(--accent-light); color: var(--accent); padding: 4px 12px; border-radius: 20px; margin: 3px; }
.rules-box {
  background: var(--card); border-radius: 12px; padding: 20px;
  text-align: left; margin-bottom: 24px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.rules-box h3 { font-size: 14px; margin-bottom: 12px; color: var(--text); }
.rules-box .rule-row {
  display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px;
  font-size: 13px; color: var(--text-secondary);
}
.rules-box .rule-score {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent-light); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
}
.btn {
  display: inline-block; padding: 14px 48px; border-radius: 28px;
  font-size: 16px; font-weight: 600; border: none; cursor: pointer;
  transition: all 0.2s; text-decoration: none;
  -webkit-appearance: none;
}
.btn-primary {
  background: var(--accent); color: #fff;
  box-shadow: 0 2px 8px rgba(184,117,74,0.25);
}
.btn-primary:active { transform: scale(0.97); opacity: 0.9; }
.btn-outline {
  background: transparent; color: var(--accent);
  border: 1.5px solid var(--accent);
}

/* Dimension sections */
.dim-section {
  margin-bottom: 12px;
}
.dim-header {
  background: var(--card); border-radius: 12px; padding: 16px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  transition: all 0.2s;
}
.dim-header:active { background: #faf8f5; }
.dim-header.completed { border-left: 3px solid var(--green); }
.dim-num {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent-light); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; margin-right: 12px;
}
.dim-info { flex: 1; min-width: 0; }
.dim-name { font-size: 15px; font-weight: 600; }
.dim-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.dim-score { font-size: 13px; color: var(--accent); font-weight: 600; white-space: nowrap; margin-left: 8px; }
.dim-arrow { font-size: 14px; color: var(--text-secondary); margin-left: 4px; transition: transform 0.2s; }
.dim-header.open .dim-arrow { transform: rotate(90deg); }

.dim-body { display: none; }
.dim-body.open { display: block; }

.dim-desc {
  font-size: 13px; color: var(--text-secondary); line-height: 1.7;
  padding: 12px 16px; background: #fdfaf7; margin: 0 4px;
  border-radius: 0 0 8px 8px;
}

/* Question card */
.q-card {
  background: var(--card); margin: 4px 4px 0;
  padding: 14px 16px; border-radius: 8px;
  border: 1px solid var(--border);
}
.q-card:first-of-type { margin-top: 4px; }
.q-card:last-of-type { border-radius: 8px 8px 12px 12px; margin-bottom: 4px; }
.q-text { font-size: 14px; margin-bottom: 10px; color: var(--text); line-height: 1.5; }
.q-num { color: var(--text-secondary); font-size: 12px; margin-right: 4px; }
.q-options {
  display: flex; gap: 8px;
}
.q-opt {
  flex: 1; text-align: center;
}
.q-opt input { display: none; }
.q-opt label {
  display: block; padding: 10px 4px; border-radius: 8px;
  border: 1.5px solid var(--border); font-size: 12px;
  cursor: pointer; transition: all 0.15s; background: #fafaf8;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.q-opt label .opt-score { font-size: 16px; font-weight: 700; display: block; margin-bottom: 2px; }
.q-opt label .opt-label { color: var(--text-secondary); font-size: 11px; }
.q-opt input:checked + label {
  border-color: var(--accent); background: var(--accent-light);
  color: var(--accent);
}
.q-opt input:checked + label .opt-label { color: var(--accent); }

/* Results */
.results { padding: 16px 0; }
.result-header {
  text-align: center; padding: 24px 16px; border-radius: 16px;
  margin-bottom: 20px;
}
.result-grade { font-size: 48px; font-weight: 800; margin-bottom: 4px; }
.result-label { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.result-desc { font-size: 14px; line-height: 1.7; padding: 0 8px; }

.grade-green { background: #edf5f0; color: var(--green); }
.grade-yellow { background: #faf6ed; color: var(--yellow); }
.grade-orange { background: #faf1ea; color: var(--orange); }
.grade-red { background: #faecec; color: var(--red); }

.dim-bar-wrap { margin-bottom: 12px; }
.dim-bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.dim-bar-name { font-weight: 500; }
.dim-bar-score { color: var(--text-secondary); }
.dim-bar-track { height: 8px; background: #ebe7e2; border-radius: 4px; overflow: hidden; }
.dim-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }

.pattern-card {
  background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.pattern-card h4 { font-size: 15px; margin-bottom: 6px; }
.pattern-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

.cross-card {
  background: #fdfaf7; border-radius: 12px; padding: 16px; margin-bottom: 12px;
  border: 1px solid var(--accent-light);
}
.cross-card h4 { font-size: 14px; color: var(--accent); margin-bottom: 6px; }
.cross-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

/* Nav buttons */
.nav-row { display: flex; gap: 12px; margin-top: 24px; justify-content: center; }

/* Footer */
.footer { text-align: center; padding: 24px 16px; font-size: 12px; color: var(--text-secondary); }
.footer strong { color: var(--accent); }

/* Toast */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(44,44,44,0.88); color: #fff; font-size: 13px;
  padding: 10px 20px; border-radius: 20px; z-index: 200;
  opacity: 0; transition: opacity 0.25s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* Bottom bar */
.bottom-bar {
  position: sticky; bottom: 0; background: rgba(250,249,246,0.95);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border); padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 100;
}
.bottom-bar .score-summary { font-size: 13px; color: var(--text-secondary); }
.bottom-bar .score-summary strong { color: var(--accent); font-size: 15px; }
</style>
</head>

// Flatten for rendering
let allQuestions = [];
let qIndex = 0;
DIMENSIONS.forEach((dim, di) => {
  dim.questions.forEach((q, qi) => {
    allQuestions.push({ dim, di, qi, globalIndex: qIndex, text: q });
    qIndex++;
  });
});
const TOTAL_QUESTIONS = allQuestions.length;

// ========== STATE ==========
// Load from localStorage
let answers = {};
try {
  const saved = localStorage.getItem('rolin_assessment_answers');
  if (saved) answers = JSON.parse(saved);
} catch(e) {}

function saveAnswers() {
  try { localStorage.setItem('rolin_assessment_answers', JSON.stringify(answers)); } catch(e) {}
}

function getAnswer(globalIndex) { return answers[globalIndex] !== undefined ? answers[globalIndex] : -1; }
function setAnswer(globalIndex, value) {
  answers[globalIndex] = value;
  saveAnswers();
}

function getDimScore(di) {
  const dim = DIMENSIONS[di];
  let score = 0;
  dim.questions.forEach((_, qi) => {
    const gi = allQuestions.findIndex(q => q.di === di && q.qi === qi);
    if (answers[gi] !== undefined) score += answers[gi];
  });
  return score;
}

function getTotalScore() {
  let total = 0;
  for (let gi = 0; gi < TOTAL_QUESTIONS; gi++) {
    if (answers[gi] !== undefined) total += answers[gi];
  }
  return total;
}

function getAnsweredCount() {
  return Object.keys(answers).length;
}

function getDimAnsweredCount(di) {
  const dim = DIMENSIONS[di];
  let count = 0;
  dim.questions.forEach((_, qi) => {
    const gi = allQuestions.findIndex(q => q.di === di && q.qi === qi);
    if (answers[gi] !== undefined) count++;
  });
  return count;
}

// ========== RENDER ==========
let currentView = 'form'; // 'form' | 'results'
let openDim = null;

function render() {
  if (currentView === 'results') {
    renderResults();
  } else {
    renderForm();
  }
  updateProgress();
}

function renderForm() {
  const main = document.getElementById('main');
  let html = '';

  // Welcome
  html += `
  <div class="welcome">
    <div class="welcome-icon">🧬</div>
    <h1>功能医学视角<br>亚健康自测表</h1>

    </div>
    <div class="rules-box">
      <h3>📋 评分规则（近3个月）</h3>
      <div class="rule-row"><span class="rule-score">0</span> 几乎没有或从不</div>

      <div class="rule-row"><span class="rule-score">2</span> 经常出现（每周1-2次），生活受限</div>
      <div class="rule-row"><span class="rule-score">3</span> 持续频繁（每周3次+），影响生活质量</div>
    </div>
  </div>`;

  // Dimension sections
  DIMENSIONS.forEach((dim, di) => {
    const answered = getDimAnsweredCount(di);
    const score = getDimScore(di);
    const isOpen = openDim === di;
    const isComplete = answered === dim.qCount;

    html += `<div class="dim-section">`;
    html += `<div class="dim-header${isComplete ? ' completed' : ''}${isOpen ? ' open' : ''}" onclick="toggleDim(${di})" id="dim-header-${di}">`;
    html += `<span class="dim-num">${di + 1}</span>`;
    html += `<span class="dim-info"><span class="dim-name">${dim.name}</span><span class="dim-meta">${dim.qCount}题 · 满分${dim.maxScore}</span></span>`;
    html += `<span class="dim-score">${answered === dim.qCount ? score + ' / ' + dim.maxScore : answered + '/' + dim.qCount}</span>`;
    html += `<span class="dim-arrow">▶</span>`;
    html += `</div>`;

    html += `<div class="dim-body${isOpen ? ' open' : ''}" id="dim-body-${di}">`;
    if (isOpen) {
      html += `<div class="dim-desc">${dim.desc}</div>`;
      dim.questions.forEach((q, qi) => {
        const gi = allQuestions.findIndex(qq => qq.di === di && qq.qi === qi);
        const val = getAnswer(gi);
        html += renderQuestionCard(gi, q, val);
      });
    }
    html += `</div>`;
    html += `</div>`;
  });

  // Bottom nav
  html += `<div class="nav-row" style="margin-top:24px;">`;
  html += `<button class="btn btn-primary" onclick="showResults()">查看我的结果 →</button>`;
  html += `</div>`;
  html += `<p style="text-align:center;font-size:12px;color:var(--text-secondary);margin-top:12px;">进度自动保存 · 可随时返回继续填写</p>`;

  main.innerHTML = html;

  // Show/hide bottom bar
  updateBottomBar();
}

function renderQuestionCard(gi, text, val) {
  let html = `<div class="q-card">`;
  html += `<div class="q-text"><span class="q-num">${gi + 1}.</span>${text}</div>`;
  html += `<div class="q-options">`;
  [0, 1, 2, 3].forEach(v => {
    const labels = ['从不', '偶尔', '经常', '持续'];
    html += `<div class="q-opt">`;
    html += `<input type="radio" name="q${gi}" id="q${gi}_${v}" value="${v}" ${val === v ? 'checked' : ''} onchange="onAnswer(${gi}, ${v})">`;
    html += `<label for="q${gi}_${v}"><span class="opt-score">${v}</span><span class="opt-label">${labels[v]}</span></label>`;
    html += `</div>`;
  });
  html += `</div></div>`;
  return html;
}

function toggleDim(di) {
  if (openDim === di) {
    openDim = null;
  } else {
    openDim = di;
  }
  render();
  if (openDim !== null) {
    setTimeout(() => {
      const el = document.getElementById('dim-body-' + openDim);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function onAnswer(gi, val) {
  setAnswer(gi, val);
  // Update the specific dim header without full re-render
  updateDimHeader(gi);
  updateProgress();
  updateBottomBar();
  showToast('已保存 ✓');
}

function updateDimHeader(gi) {
  const q = allQuestions[gi];
  const di = q.di;
  const dim = DIMENSIONS[di];
  const answered = getDimAnsweredCount(di);
  const score = getDimScore(di);
  const header = document.getElementById('dim-header-' + di);
  if (!header) return;
  const isComplete = answered === dim.qCount;
  if (isComplete) {
    header.classList.add('completed');
  } else {
    header.classList.remove('completed');
  }
  const scoreEl = header.querySelector('.dim-score');
  if (scoreEl) {
    scoreEl.textContent = answered === dim.qCount ? score + ' / ' + dim.maxScore : answered + '/' + dim.qCount;
  }
}

function updateProgress() {
  const answered = getAnsweredCount();
  const pct = Math.round((answered / TOTAL_QUESTIONS) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('header-progress').textContent = answered + '/' + TOTAL_QUESTIONS;
}

function updateBottomBar() {
  const bar = document.getElementById('bottom-bar');
  const answered = getAnsweredCount();
  if (currentView === 'form') {
    bar.style.display = 'flex';
    document.getElementById('bb-answered').textContent = answered;
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

// ========== RESULTS ==========
function showResults() {
  const answered = getAnsweredCount();
  if (answered < 100) {
    if (!confirm(`你只完成了 ${answered}/${TOTAL_QUESTIONS} 题（${Math.round(answered/TOTAL_QUESTIONS*100)}%），未完成的题目将计0分。确定查看结果吗？`)) {
      return;
    }
  }
  currentView = 'results';
  openDim = null;
  window.scrollTo(0, 0);
  render();
  document.getElementById('bottom-bar').style.display = 'none';
}

function renderResults() {
  const totalScore = getTotalScore();
  const answered = getAnsweredCount();
  const totalMax = 474;

  // Grade
  let gradeClass, gradeEmoji, gradeLabel, gradeDesc;
  if (totalScore <= 50) {
    gradeClass = 'grade-green'; gradeEmoji = '🟢'; gradeLabel = '绿灯';
    gradeDesc = '你的功能状态良好。继续保持现在的饮食和生活方式。可以把这份自测表当作年度体检的补充来定期追踪。';
  } else if (totalScore <= 120) {
    gradeClass = 'grade-yellow'; gradeEmoji = '🟡'; gradeLabel = '黄灯';
    gradeDesc = '你已经有多个系统的轻度亚健康信号。这些信号单独看可能不明显，但它们在同一时间段集中出现——这正是功能医学最有价值的干预窗口。建议从得分率最高的2个维度开始进行3个月的饮食调整，3个月后再次自测比对。';
  } else if (totalScore <= 200) {
    gradeClass = 'grade-orange'; gradeEmoji = '🟠'; gradeLabel = '橙灯';
    gradeDesc = '你的身体在多个维度上发出了明确的求救信号。这些症状不是"老了"或"累了"——它们每一个在功能医学框架中都有可追溯的生理链条。建议从得分率最高的3个维度着手饮食干预，并寻求功能医学医师的进一步评估。';
  } else {
    gradeClass = 'grade-red'; gradeEmoji = '🔴'; gradeLabel = '红灯';
    gradeDesc = '你的身体在多个系统上已经积累了显著的生理负荷。建议优先完成医学排查（常规检查排除器质性疾病），然后与功能医学从业者合作，系统性地清理每一个瓶颈。慢性疲劳和亚健康不是单一病因——当瓶颈清除得足够多，症状会逐个消退。';
  }

  let html = '<div class="results">';

  // Grade header
  html += `<div class="result-header ${gradeClass}">`;
  html += `<div class="result-grade">${gradeEmoji}</div>`;
  html += `<div class="result-label">${gradeLabel} · ${totalScore} / ${totalMax} 分</div>`;
  html += `<div class="result-desc">${gradeDesc}</div>`;
  html += `</div>`;

  // Dimension breakdown
  html += `<h3 style="font-size:16px;margin-bottom:12px;">📊 各维度得分明细</h3>`;

  // Calculate and sort dimensions by score rate
  let dimResults = DIMENSIONS.map((dim, di) => {
    const score = getDimScore(di);
    const rate = dim.maxScore > 0 ? Math.round((score / dim.maxScore) * 100) : 0;
    return { dim, di, score, rate };
  });
  dimResults.sort((a, b) => b.rate - a.rate);

  dimResults.forEach(dr => {
    const rateColor = dr.rate > 50 ? 'var(--red)' : dr.rate > 30 ? 'var(--orange)' : dr.rate > 15 ? 'var(--yellow)' : 'var(--green)';
    html += `<div class="dim-bar-wrap">`;
    html += `<div class="dim-bar-label"><span class="dim-bar-name">${dr.dim.name}</span><span class="dim-bar-score">${dr.score}/${dr.dim.maxScore}（${dr.rate}%）</span></div>`;
    html += `<div class="dim-bar-track"><div class="dim-bar-fill" style="width:${dr.rate}%;background:${rateColor};"></div></div>`;
    html += `</div>`;
  });

  // Pattern matching
  html += `<h3 style="font-size:16px;margin:24px 0 12px;">🔍 主导模式识别</h3>`;

  const patterns = detectPatterns(dimResults);
  if (patterns.length === 0) {
    html += `<p style="font-size:13px;color:var(--text-secondary);">你的症状分布较均匀，没有单一主导模式。建议重点关注得分率最高的3个维度。</p>`;
  } else {
    patterns.forEach(p => {
      html += `<div class="pattern-card"><h4>${p.name}</h4><p>核心病理：${p.pathology}<br>Rolin厨房优先策略：${p.strategy}</p></div>`;

  }

  // Cross-dimension insights
  html += `<h3 style="font-size:16px;margin:24px 0 12px;">🔗 跨维度交叉洞察</h3>`;
  const crossInsights = getCrossInsights(dimResults);

    html += `<p style="font-size:13px;color:var(--text-secondary);">没有检测到显著的跨维度交叉模式。</p>`;
  } else {
    crossInsights.forEach(ci => {
      html += `<div class="cross-card"><h4>${ci.title}</h4><p>${ci.desc}</p></div>`;
    });
  }

  // CTA
  html += `<div style="text-align:center;margin-top:24px;padding:20px;background:var(--accent-light);border-radius:12px;">`;
  html += `<p style="font-size:14px;color:var(--accent);margin-bottom:8px;font-weight:600;">想了解你的个性化饮食干预方案？</p>`;
  html += `<p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">把这份结果截图发给Rolin，免费获取1v1饮食风险简评</p>`;
  html += `<button class="btn btn-outline" onclick="backToForm()">← 返回修改答案</button>`;

function detectPatterns(dimResults) {
  // Build a map of dimension rates
  const rates = {};
  dimResults.forEach(dr => { rates[dr.di] = dr.rate; });

  const patterns = [];

  // HPA axis depletion: d1(energy) + d7(sleep) + d5(brain) + d12(reproductive) all high
  const hpaDims = [0, 6, 4, 11]; // d1, d7, d5, d12
  const hpaRate = hpaDims.reduce((sum, di) => sum + (rates[di] || 0), 0) / hpaDims.length;
  if (hpaRate > 30) {
    patterns.push({
      name: 'HPA轴耗竭型',
      pathology: '慢性压力→皮质醇节律失调→压制TSH和GnRH',
      strategy: '血糖稳定+早光+镁/B5/VC→能量午桌午餐方案'
    });
  }

  // Gut-centric: d2(digestion) + d6(skin) + d4(inflammation) + d5(brain fog)
  const gutDims = [1, 5, 3, 4];
  const gutRate = gutDims.reduce((sum, di) => sum + (rates[di] || 0), 0) / gutDims.length;
  if (gutRate > 30) {
    patterns.push({
      name: '肠道中心型',
      pathology: '肠漏→LPS→TLR4→NF-κB→全身低度炎症',
      strategy: '肠道修复5R方案→30天不重样午餐计划'
    });
  }

  // Metabolic: d3(metabolism) + d1(post-meal fatigue) + d6(dull skin) + d9(hair loss)
  const metaDims = [2, 0, 5, 8];
  const metaRate = metaDims.reduce((sum, di) => sum + (rates[di] || 0), 0) / metaDims.length;
  if (metaRate > 30) {
    patterns.push({
      name: '代谢紊乱型',
      pathology: '胰岛素抵抗→"富饶中的饥荒"——血糖在血中但细胞饥饿',
      strategy: '控糖午餐方案→先菜后饭+蛋白足量+慢碳水'
    });
  }

  // Immune-inflammatory: d4(inflammation) + d16(resp) + d6(skin) + d13(joints)
  const immDims = [3, 15, 5, 12];
  const immRate = immDims.reduce((sum, di) => sum + (rates[di] || 0), 0) / immDims.length;
  if (immRate > 30) {
    patterns.push({
      name: '免疫炎症型',
      pathology: '慢性免疫激活+SPM消退信号不足→炎症不能自行终止',
      strategy: '抗炎抗敏餐桌→EPA/DHA+槲皮素+多酚辅食'
    });
  }

  // Hypothyroid tendency: d1(fatigue) + d7(cant wake) + d10(swelling) + d9(eyebrow) + d11(cold)
  const hypoDims = [0, 6, 9, 8, 10];
  const hypoRate = hypoDims.reduce((sum, di) => sum + (rates[di] || 0), 0) / hypoDims.length;
  if (hypoRate > 30) {
    patterns.push({
      name: '甲减倾向型',
      pathology: 'T3不足→细胞怠速+黏液性水肿',
      strategy: '甲功支持→碘+硒+锌+酪氨酸充足午餐'
    });
  }

  // Neurotransmitter: d5(brain) + d1(lack drive) + d7(cant sleep) + d8(oral ulcers)
  const neuroDims = [4, 0, 6, 7];
  const neuroRate = neuroDims.reduce((sum, di) => sum + (rates[di] || 0), 0) / neuroDims.length;
  if (neuroRate > 30) {
    patterns.push({
      name: '神经递质型',
      pathology: 'DA↓+NE↓+GABA↓+5-HT↓——神经递质合成原料或辅因子不足',
      strategy: '神经递质前体→高蛋白+铁+锌+镁+B6'
    });
  }

  // Histamine intolerance: d4(urticaria/allergy) + d2(bloating) + d6(itch) + d16(rhinitis) + d10(dark circles)
  const histDims = [3, 1, 5, 15, 9];
  const histRate = histDims.reduce((sum, di) => sum + (rates[di] || 0), 0) / histDims.length;
  if (histRate > 30) {
    patterns.push({
      name: '组胺不耐受型',
      pathology: 'DAO/HNMT不足→食物+菌群+内源性组胺三重叠加超降解能力',
      strategy: '低组胺饮食+槲皮素+DAO支持食物'
    });
  }

  return patterns;
}
